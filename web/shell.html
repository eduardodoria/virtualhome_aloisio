<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Casa Aloísio</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1014;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: 0;
      outline: 0;
      touch-action: none;
    }

    /* not #status/#progress/#spinner: hideEmscriptenUI hides those ids */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1014;
      color: #c9d1d9;
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 400ms ease, visibility 400ms ease;
    }

    #loading.done {
      visibility: hidden;
      opacity: 0;
    }

    .load-box {
      width: min(340px, 76%);
      text-align: center;
    }

    .load-title {
      margin-bottom: 18px;
      font-size: 20px;
      color: #f0f3f6;
    }

    .load-spin {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: #e3a64a;
      border-radius: 50%;
      animation: load-spin 900ms linear infinite;
    }

    @keyframes load-spin {
      to { transform: rotate(360deg); }
    }

    #load-text {
      min-height: 1.4em;
      margin-bottom: 10px;
      color: #9aa5b1;
      font-size: 13px;
    }

    .load-track {
      height: 6px;
      overflow: hidden;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
    }

    #load-bar {
      width: 0;
      height: 100%;
      background: #e3a64a;
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

  <div id="loading" role="status" aria-live="polite">
    <div class="load-box">
      <div class="load-title">Casa Aloísio</div>
      <div class="load-spin" aria-hidden="true"></div>
      <div id="load-text">Carregando…</div>
      <div class="load-track" aria-hidden="true"><div id="load-bar"></div></div>
    </div>
  </div>

  <script>
    var canvas = document.getElementById('canvas');
    var loading = document.getElementById('loading');
    var loadText = document.getElementById('load-text');
    var loadBar = document.getElementById('load-bar');
    var dependencies = 0;

    function setBar(percent) {
      loadBar.style.width = Math.max(0, Math.min(100, percent)) + '%';
    }

    function megabytes(bytes) {
      return (bytes / 1048576).toFixed(bytes < 10485760 ? 1 : 0);
    }

    canvas.addEventListener('pointerdown', function() {
      canvas.focus({ preventScroll: true });
    });

    // keep the arrows and space for the walk instead of scrolling the page
    window.addEventListener('keydown', function(e) {
      var code = e.code || e.key;
      if (code === 'Space' || code === 'ArrowUp' || code === 'ArrowDown' || code === 'ArrowLeft' || code === 'ArrowRight') {
        e.preventDefault();
      }
    });

    // On GitHub Pages the data package is in parts (web/prepare_site.sh: git refuses files over 100 MB).
    // When <app>.data is missing, its parts come as one response with the total size, so the
    // Emscripten loader and its progress see a single download.
    var plainFetch = window.fetch.bind(window);
    window.fetch = function(input, init) {
      var url = typeof input === 'string' ? input : input.url;
      if (!/\.data$/.test(url)) return plainFetch(input, init);
      return plainFetch(input, init).then(function(response) {
        if (response.ok) return response;
        return plainFetch(url + '.parts').then(function(list) {
          if (!list.ok) return response;
          return list.json().then(function(manifest) {
            var base = url.slice(0, url.lastIndexOf('/') + 1);
            var index = 0;
            var reader = null;
            var body = new ReadableStream({
              pull: async function(controller) {
                while (true) {
                  if (!reader) {
                    if (index >= manifest.parts.length) {
                      controller.close();
                      return;
                    }
                    var part = await plainFetch(base + manifest.parts[index++]);
                    if (!part.ok) throw new Error(part.status + ': ' + part.url);
                    reader = part.body.getReader();
                  }
                  var chunk = await reader.read();
                  if (!chunk.done) {
                    controller.enqueue(chunk.value);
                    return;
                  }
                  reader = null;
                }
              }
            });
            return new Response(body, { headers: { 'Content-Length': String(manifest.size) } });
          });
        });
      });
    };

    var Module = {
      canvas: canvas,

      postRun: [function() {
        setBar(100);
        loading.classList.add('done');
        canvas.focus({ preventScroll: true });
      }],

      print: function() {
        console.log(Array.prototype.slice.call(arguments).join(' '));
      },

      printErr: function() {
        console.error(Array.prototype.slice.call(arguments).join(' '));
      },

      // Emscripten reports the download as "Downloading data... (done/total)" in bytes
      setStatus: function(text) {
        if (!text) return;
        var match = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
        if (match) {
          var done = Number(match[1]);
          var total = Number(match[2]);
          if (total > 0) {
            setBar(90 * done / total);
            loadText.textContent = 'Baixando ' + megabytes(done) + ' de ' + megabytes(total) + ' MB';
            return;
          }
        }
        if (/^Running/i.test(text)) {
          setBar(95);
          loadText.textContent = 'Preparando a cena…';
        } else if (/^Preparing/i.test(text)) {
          loadText.textContent = 'Preparando…';
        }
      },

      monitorRunDependencies: function(left) {
        dependencies = Math.max(dependencies, left);
        if (left === 0) {
          setBar(92);
          loadText.textContent = 'Preparando a cena…';
        }
      }
    };

    Module.setStatus('Carregando…');

    window.onerror = function() {
      loadText.textContent = 'Não foi possível iniciar. Veja o console do navegador.';
      loadText.style.color = '#ff7b8b';
    };
  </script>

  {{{ SCRIPT }}}
</body>
</html>
